name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças do SDK
        run: yes | sdkmanager --licenses || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Gerar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Tornar gradlew executável
        run: chmod +x ./gradlew

      - name: Build do APK (Debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/PerformanceLauncher-debug.apk

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: PerformanceLauncher-APK
          path: app/build/outputs/apk/debug/PerformanceLauncher-debug.apk
